name: Test and deploy HOSTKEY

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostkey-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: bash -n scripts/*.sh tests/*.sh
      - run: bash tests/backup-archive.test.sh
      - run: npm ci
      - run: npm test
      - name: Create disposable PostgreSQL databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE comment_to_dm_integration'
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE comment_to_dm_migration'
      - name: Run migration tests on a disposable database
        env:
          ALLOW_DESTRUCTIVE_TEST_DB: "1"
          INTEGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/comment_to_dm_migration
        run: npm run test:migration
      - name: Run integration tests on a disposable database
        env:
          ALLOW_DESTRUCTIVE_TEST_DB: "1"
          INTEGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/comment_to_dm_integration
        run: npm run test:integration
      - run: npm run build
      - run: npm run lint

  deploy:
    if: github.repository == 'xvn3x/comment-to-dm'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - name: Prepare restricted SSH configuration
        env:
          DEPLOY_KEY: ${{ secrets.HOSTKEY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTKEY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/comment-to-dm-deploy
          chmod 600 ~/.ssh/comment-to-dm-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Create release archive
        run: git archive --format=tar.gz --output="comment-to-dm-${GITHUB_SHA}.tar.gz" HEAD
      - name: Upload release archive
        env:
          DEPLOY_HOST: ${{ secrets.HOSTKEY_HOST }}
          DEPLOY_USER: ${{ secrets.HOSTKEY_USER }}
        run: |
          scp -i ~/.ssh/comment-to-dm-deploy \
            "comment-to-dm-${GITHUB_SHA}.tar.gz" "scripts/deploy-release.sh" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/comment-to-dm/incoming/"
      - name: Deploy with backup, readiness check and rollback
        env:
          DEPLOY_HOST: ${{ secrets.HOSTKEY_HOST }}
          DEPLOY_USER: ${{ secrets.HOSTKEY_USER }}
        run: |
          ssh -i ~/.ssh/comment-to-dm-deploy "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mv /opt/comment-to-dm/incoming/deploy-release.sh /opt/comment-to-dm/incoming/deploy-release-${GITHUB_SHA}.sh && \
             sed -i 's/\\r$//' /opt/comment-to-dm/incoming/deploy-release-${GITHUB_SHA}.sh && \
             bash /opt/comment-to-dm/incoming/deploy-release-${GITHUB_SHA}.sh '${GITHUB_SHA}'; \
             status=\$?; rm -f /opt/comment-to-dm/incoming/deploy-release-${GITHUB_SHA}.sh; exit \$status"
